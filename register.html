<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — TopNET GSI</title>
  <meta name="description" content="Заявка на подключение к сети TopNET GSI: пробный период 14 дней, для приёмников Topcon / Sokkia / SinoGNSS — 28 дней." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 16 L16 4 L28 16 L16 28 Z' fill='none' stroke='%230E5AA7' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%230E5AA7'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/register.css" />
</head>
<body class="auth">

  <!-- фон: живая сеть, видна по бокам от карточки формы -->
  <canvas class="auth__canvas" id="netCanvas" aria-hidden="true"></canvas>

  <!-- ================= МИНИ-ШАПКА ================= -->
  <header class="auth__header">
    <a href="index.html" class="auth__logo" aria-label="TopNET GSI — на главную">
      <img src="assets/images/logo.png" alt="TopNET GSI" />
    </a>
  </header>

  <!-- ================= ЗАЯВКА НА ПОДКЛЮЧЕНИЕ ================= -->
  <main class="auth__main">
    <div class="reg__stack">

      <!-- ---------- Пробный период ---------- -->
      <div class="trial">
        <div class="trial__card">
          <span class="trial__days">14 дней</span>
          <span class="trial__text">пробный период для новых пользователей</span>
        </div>
        <div class="trial__card">
          <span class="trial__days">28 дней</span>
          <span class="trial__text">для приёмников Topcon / Sokkia / SinoGNSS</span>
        </div>
      </div>
      <p class="trial__note">
        или направьте заявку на <a href="mailto:topnet@gsi.ru">topnet@gsi.ru</a>
      </p>

      <!-- ---------- Форма ---------- -->
      <div class="auth__card auth__card--wide">
        <h1 class="auth__title">Регистрация</h1>
        <p class="auth__subtitle">Заполните заявку — данные для подключения придут на ваш email.</p>

        <form id="regForm" novalidate>

          <label class="switch switch--top">
            <input type="checkbox" class="switch__input" id="isIndividual" />
            <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
            <span class="switch__text">Физическое лицо</span>
          </label>

          <div class="field">
            <label class="field__label" for="regName">ФИО<span class="req" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="regName" name="name" required
                   placeholder="Иванов Иван Иванович" autocomplete="name" />
          </div>

          <div class="field" id="orgField">
            <label class="field__label" for="regOrg">Название организации<span class="req" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="regOrg" name="org" required
                   placeholder="ООО «Компания»" autocomplete="organization" />
          </div>

          <div class="field-row">
            <div class="field">
              <label class="field__label" for="regRegion">Регион<span class="req" aria-hidden="true">*</span></label>
              <input class="field__input" type="text" id="regRegion" name="region" required
                     placeholder="Московская область" />
            </div>
            <div class="field">
              <label class="field__label" for="regCity">Город<span class="req" aria-hidden="true">*</span></label>
              <input class="field__input" type="text" id="regCity" name="city" required
                     placeholder="Москва" autocomplete="address-level2" />
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label class="field__label" for="regEmail">Email<span class="req" aria-hidden="true">*</span></label>
              <input class="field__input" type="email" id="regEmail" name="email" required
                     placeholder="you@example.com" autocomplete="email" />
            </div>
            <div class="field">
              <label class="field__label" for="regPhone">Мобильный телефон<span class="req" aria-hidden="true">*</span></label>
              <input class="field__input" type="tel" id="regPhone" name="phone" required
                     placeholder="+7 (___) ___-__-__" autocomplete="tel" inputmode="tel" />
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="regReceivers">Количество роверных приёмников</label>
            <select class="field__select" id="regReceivers" name="receivers">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="more">более 5</option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="regVendor">Производитель приёмников<span class="req" aria-hidden="true">*</span></label>
            <select class="field__select" id="regVendor" name="vendor" required>
              <option value="" selected disabled>Выберите производителя</option>
              <option value="topcon">Topcon</option>
              <option value="sokkia">Sokkia</option>
              <option value="sinognss">SinoGNSS</option>
              <option value="other">Другой</option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="regField">Сфера деятельности<span class="req" aria-hidden="true">*</span></label>
            <select class="field__select" id="regField" name="field" required>
              <option value="" selected disabled>Выберите сферу</option>
              <option value="geodesy">геодезия и изыскания</option>
              <option value="cadastre">кадастр</option>
              <option value="construction">строительство</option>
              <option value="agriculture">сельское хозяйство</option>
              <option value="other">другое</option>
            </select>
          </div>

          <div class="consents">
            <label class="switch">
              <input type="checkbox" class="switch__input" id="regConsent" required />
              <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
              <span class="switch__text">
                Согласен на обработку персональных данных<span class="req" aria-hidden="true">*</span>
                — <a href="#" target="_self">политика конфиденциальности</a>
              </span>
            </label>

            <label class="switch">
              <input type="checkbox" class="switch__input" id="regMailing" checked />
              <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
              <span class="switch__text">Согласен получать рассылку по e-mail</span>
            </label>
          </div>

          <button type="submit" class="btn btn--primary btn--block">Отправить</button>
        </form>

        <p class="msg" id="regMsg" role="status" hidden></p>
      </div>

    </div>
  </main>

  <!-- network.js — только фоновая сеть: логика формы ЛК не активируется (нет её элементов) -->
  <script src="js/network.js" defer></script>
  <script src="js/register.js" defer></script>
</body>
</html>
