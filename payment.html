<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оплата подписки — TopNET GSI</title>
  <meta name="description" content="Оплата подписки TopNET GSI по данным аккаунта." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#1A2733" />
  <link rel="stylesheet" href="assets/Inter/css/inter.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/cookie.css" />
  <link rel="stylesheet" href="css/to-top.css" />
</head>
<body class="auth">

  <!-- фон: живая сеть, видна по бокам от карточки -->
  <canvas class="auth__canvas" id="netCanvas" aria-hidden="true"></canvas>

  <!-- ================= МИНИ-ШАПКА ================= -->
  <header class="auth__header">
    <a href="index.html" class="auth__logo" aria-label="TopNET GSI — на главную">
      <img src="assets/images/logo.png" alt="TopNET GSI" />
    </a>
  </header>

  <!-- ================= ОПЛАТА ================= -->
  <main class="auth__main">
    <div class="auth__card">
      <img src="assets/images/topnet_logo.png" alt="Topnet Live" class="auth__brand" />
      <h1 class="auth__title">Оплата подписки</h1>
      <p class="auth__subtitle">Введите данные аккаунта — мы найдём вашу подписку.</p>

      <form id="paymentForm" novalidate>
        <div class="field">
          <label class="field__label" for="payAccount">Email или логин</label>
          <input class="field__input" type="text" id="payAccount" name="account"
                 placeholder="you@example.com" autocomplete="username" />
        </div>

        <div class="field">
          <label class="field__label" for="payPassword">Пароль</label>
          <input class="field__input" type="password" id="payPassword" name="password"
                 placeholder="Введите пароль" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn--primary btn--block">Найти</button>
      </form>

      <p class="msg" id="payMsg" role="status" hidden></p>
    </div>
  </main>


  <!-- ================= КНОПКА «НАЗАД» (закреплена в правом нижнем углу) ================= -->
  <a href="index.html" class="back-fab" data-back>
    <span class="back-fab__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    Назад
  </a>


  <!-- ================= СОГЛАСИЕ НА COOKIE ================= -->
  <aside class="cookie" data-cookie role="region" aria-label="Согласие на обработку cookie" hidden>
    <p class="cookie__text">
      Продолжая использовать наш сайт, Вы соглашаетесь с
      <a href="privacy.html">условиями обработки cookie и данных о поведении на сайте</a>,
      нужных нам для аналитики. Запретить обработку cookie Вы можете через браузер.
    </p>
    <button type="button" class="cookie__btn" data-cookie-accept>ОК</button>
  </aside>
  <!-- network.js — только фоновая сеть: элементов формы ЛК на странице нет -->
  <script src="js/network.js" defer></script>
  <script src="js/payment.js" defer></script>
  <script src="js/auth-back.js" defer></script>
  <script src="js/cookie.js" defer></script>
  <script src="js/to-top.js" defer></script>
</body>
</html>
