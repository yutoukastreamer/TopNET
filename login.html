<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный кабинет — TopNET GSI</title>
  <meta name="description" content="Вход в личный кабинет TopNET GSI." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 16 L16 4 L28 16 L16 28 Z' fill='none' stroke='%230E5AA7' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%230E5AA7'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth">

  <!-- фон: живая сеть, видна по бокам от карточки формы -->
  <canvas class="auth__canvas" id="netCanvas" aria-hidden="true"></canvas>

  <!-- ================= МИНИ-ШАПКА ================= -->
  <header class="auth__header">
    <a href="index.html" class="auth__logo" aria-label="TopNET GSI — на главную">
      <img src="assets/images/logo.png" alt="TopNET GSI" />
    </a>
  </header>

  <!-- ================= ФОРМА ВХОДА ================= -->
  <main class="auth__main">
    <div class="auth__card">
      <h1 class="auth__title">Личный кабинет</h1>
      <p class="auth__subtitle">Войдите, чтобы управлять услугами и доступом к сети.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="field__label" for="login">Логин</label>
          <input class="field__input" type="text" id="login" name="login"
                 placeholder="Введите логин" autocomplete="username" />
        </div>

        <div class="field">
          <label class="field__label" for="password">Пароль</label>
          <input class="field__input" type="password" id="password" name="password"
                 placeholder="Введите пароль" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn--primary btn--block">Войти</button>
      </form>

      <p class="msg" id="loginMsg" role="status" hidden></p>

      <button type="button" class="auth__forgot" id="forgotBtn">Забыли пароль?</button>
    </div>
  </main>

  <!-- ================= МОДАЛКА «ЗАБЫЛИ ПАРОЛЬ?» ================= -->
  <div class="modal" id="forgotModal" role="dialog" aria-modal="true"
       aria-labelledby="forgotTitle" hidden>
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__dialog">
      <button type="button" class="modal__close" aria-label="Закрыть" data-modal-close>&times;</button>

      <h2 class="modal__title" id="forgotTitle">Восстановление пароля</h2>
      <p class="modal__text">Укажите email — вышлем ссылку для сброса пароля.</p>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label class="field__label" for="email">Email</label>
          <input class="field__input" type="email" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email" />
        </div>
        <button type="submit" class="btn btn--primary btn--block">Отправить</button>
      </form>

      <p class="msg" id="forgotMsg" role="status" hidden></p>
    </div>
  </div>

  <script src="js/network.js" defer></script>
</body>
</html>
